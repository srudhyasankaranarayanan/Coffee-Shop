<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: #f5e6d3;
        }

        .nav{
            background-color: #4b2e2e;
            padding: 15px;
            text-align: center;
        }

        .nav a{
            color: white;
            margin: 10px;
            text-decoration: none;
            font-size: 18px;
        }

        .nav a:hover{
            color: #ffcc99;
        }

        .section-title{
            text-align: center;
            margin-top: 30px;
            font-size: 30px;
            color: #4b2e2e;
        }

        .Main{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px;
        }

        .card{
            background-color: white;
            width: 220px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        .card img{
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .card:hover{
            transform: scale(1.05);
            transition: 0.3s;
        }

        button{
            padding: 8px 12px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #4b2e2e;
            color: white;
            cursor: pointer;
        }

        button:hover{
            background-color: #c97b63;
        }

        p{
            font-size: 18px;
            font-weight: bold;
            color: #4b2e2e;
        }

        .quantity-box{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .quantity-box span{
            font-size: 20px;
            font-weight: bold;
            width: 20px;
        }

    </style>
</head>

<body>

    <div class="nav">
        <a href="home.html">Home</a>
        <a href="Register.html"></a>
        <a href="login.html">Login</a>
        <a href="Menu.html">Menu</a>
        <a href="shop.html">Shop</a>

    <script>

        function increaseQuantity(id){

            let qty = document.getElementById(id);

            qty.innerText = parseInt(qty.innerText) + 1;
        }

        function decreaseQuantity(id){

            let qty = document.getElementById(id);

            let current = parseInt(qty.innerText);

            if(current > 0){
                qty.innerText = current - 1;
            }
        }

        function orderitem(product){

            alert(product + " ordered successfully!");
        }

        function Addcart(product, qtyId){

            let quantity = document.getElementById(qtyId).innerText;

            alert(quantity + " " + product + "(s) added to cart!");
        }

    </script>
