<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>

    <style>

        body{
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: burlywood;
            color: white;
        }

        /* Navigation Bar */
        .nav{
            background-color: black;
            padding: 15px;
        }

        .nav a{
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
            transition: 0.3s;
        }

        .nav a:hover{
            color: hotpink;
        }

        /* Heading */
        h1{
            margin-top: 30px;
            font-size: 45px;
        }

        /* Main Image */
        .main-image{
            width: 90%;
            max-width: 1200px;
            height: 600px;
            margin-top: 30px;
            border-radius: 25px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

    </style>
</head>

<body>

    <!-- Navigation -->
    <div class="nav">
        <a href="Home.html">Home</a>
        <a href="Register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="Menu.html">Menu</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
    </div>

    <!-- Heading -->
    <h1>Welcome to Our Coffee Shop</h1>

    <!-- Main Image -->
    <img 
        class="main-image"
        src="https://m.media-amazon.com/images/I/71ZgCZSbWgL._AC_UF894,1000_QL80_.jpg"
        alt="Product Image"
    >

</html>
