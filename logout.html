<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout — Brew Haven</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F5ECD7;
            --espresso: #1C0F07;
            --caramel: #C68B3E;
            --latte: #D4A96A;
            --fog: #EDE0C8;
            --dark-roast: #2E1B0E;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--espresso);
            color: var(--cream);
            font-family: 'Cormorant Garamond', serif;
            min-height: 100vh;
            display: flex;
            cursor: none;
            overflow: hidden;
        }

        /* ── Custom Cursor ── */
        .cursor {
            width: 10px; height: 10px;
            background: var(--caramel);
            border-radius: 50%;
            position: fixed; top: 0; left: 0;
            pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }
        .cursor-ring {
            width: 36px; height: 36px;
            border: 1.5px solid var(--caramel);
            border-radius: 50%;
            position: fixed; top: 0; left: 0;
            pointer-events: none; z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width .3s, height .3s, opacity .3s;
            opacity: 0.6;
        }

        /* ── Left Panel ── */
        .left-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: none;
        }
        @media (min-width: 800px) { .left-panel { display: block; } }

        .left-panel img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.32) saturate(0.65);
        }

        .left-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to right, transparent, var(--espresso));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 60px 50px;
        }

        .left-quote {
            font-family: 'Playfair Display', serif;
            font-size: 38px; font-weight: 700;
            line-height: 1.15;
            color: var(--cream);
            margin-bottom: 16px;
        }
        .left-quote em { font-style: italic; color: var(--caramel); }
        .left-attr {
            font-family: 'DM Mono', monospace;
            font-size: 10px; letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--fog); opacity: .4;
        }

        /* ── Right Panel ── */
        .right-panel {
            width: 100%; max-width: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 50px;
            position: relative;
            background: var(--dark-roast);
        }
        @media (min-width: 800px) { .right-panel { min-height: 100vh; } }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 24px; font-weight: 900;
            color: var(--cream);
            margin-bottom: 56px;
            text-decoration: none;
            display: block;
        }
        .brand span { color: var(--caramel); }

        /* ── Cup Icon ── */
        .icon-wrap {
            width: 72px; height: 72px;
            border: 1px solid rgba(198,139,62,.35);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            margin-bottom: 28px;
            background: rgba(198,139,62,.06);
            animation: fadeUp .7s .1s ease both;
        }

        .form-eyebrow {
            font-family: 'DM Mono', monospace;
            font-size: 10px; letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--caramel);
            margin-bottom: 12px;
            animation: fadeUp .7s .15s ease both;
        }

        .form-title {
            font-family: 'Playfair Display', serif;
            font-size: 42px; font-weight: 900;
            line-height: .95;
            color: var(--cream);
            margin-bottom: 6px;
            animation: fadeUp .7s .2s ease both;
        }
        .form-title em { font-style: italic; color: var(--caramel); }

        .form-sub {
            font-size: 17px; font-weight: 300;
            color: var(--fog); opacity: .55;
            line-height: 1.65;
            margin-bottom: 40px;
            animation: fadeUp .7s .25s ease both;
        }

        /* ── User chip (shows logged-in name if any) ── */
        .user-chip {
            display: flex; align-items: center; gap: 12px;
            background: rgba(198,139,62,.08);
            border: 1px solid rgba(198,139,62,.22);
            border-radius: 2px;
            padding: 14px 18px;
            margin-bottom: 30px;
            animation: fadeUp .7s .3s ease both;
        }
        .user-avatar {
            width: 34px; height: 34px;
            background: var(--caramel);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 16px; font-weight: 700;
            color: var(--espresso);
            flex-shrink: 0;
        }
        .user-info { flex: 1; }
        .user-name {
            font-family: 'Playfair Display', serif;
            font-size: 17px; font-weight: 700;
            color: var(--cream);
            line-height: 1.2;
        }
        .user-label {
            font-family: 'DM Mono', monospace;
            font-size: 9px; letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--fog); opacity: .4;
            margin-top: 2px;
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: rgba(245,236,215,.1);
            margin-bottom: 28px;
            animation: fadeUp .7s .32s ease both;
        }

        /* ── Buttons ── */
        .btn-logout {
            width: 100%; padding: 16px;
            background: var(--caramel);
            border: none;
            color: var(--espresso);
            cursor: pointer;
            border-radius: 2px;
            font-family: 'DM Mono', monospace;
            font-size: 12px; letter-spacing: .22em;
            text-transform: uppercase;
            transition: background .3s, transform .2s;
            margin-bottom: 12px;
            animation: fadeUp .7s .35s ease both;
        }
        .btn-logout:hover { background: var(--latte); transform: translateY(-2px); }

        .btn-stay {
            width: 100%; padding: 14px;
            background: transparent;
            border: 1px solid rgba(245,236,215,.18);
            color: var(--fog);
            cursor: pointer;
            border-radius: 2px;
            font-family: 'DM Mono', monospace;
            font-size: 11px; letter-spacing: .2em;
            text-transform: uppercase;
            transition: border-color .3s, color .3s, background .3s;
            text-decoration: none;
            display: block; text-align: center;
            animation: fadeUp .7s .4s ease both;
        }
        .btn-stay:hover {
            border-color: var(--caramel);
            color: var(--cream);
            background: rgba(198,139,62,.06);
        }

        /* ── Success / Redirecting state ── */
        .redirect-msg {
            display: none;
            text-align: center;
            padding: 20px 0 0;
            animation: fadeUp .5s ease both;
        }
        .redirect-msg.show { display: block; }
        .redirect-dots {
            font-family: 'DM Mono', monospace;
            font-size: 10px; letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--caramel);
            margin-top: 10px;
        }

        /* ── Progress bar (redirecting) ── */
        .progress-bar {
            height: 2px;
            background: rgba(245,236,215,.08);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
            display: none;
        }
        .progress-bar.show { display: block; }
        .progress-fill {
            height: 100%;
            width: 0;
            background: var(--caramel);
            border-radius: 2px;
            transition: width 2s linear;
        }

        /* ── Brand animation ── */
        .brand { animation: fadeUp .7s .05s ease both; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <!-- Left atmospheric panel -->
    <div class="left-panel">
        <img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=1200&q=80" alt="Coffee shop">
        <div class="left-overlay">
            <div class="left-quote">Until we <em>brew</em> again.</div>
            <div class="left-attr">— Brew Haven, Est. 2009</div>
        </div>
    </div>

    <!-- Right panel -->
    <div class="right-panel">
        <a href="Home.html" class="brand">Brew<span>Haven</span></a>

        <div class="icon-wrap">☕</div>

        <div class="form-eyebrow">See you soon</div>
        <h1 class="form-title">Sign <em>Out</em></h1>
        <p class="form-sub">You're about to leave. Your cart will be cleared and your session ended.</p>

        <!-- Logged-in user chip -->
        <div class="user-chip" id="userChip">
            <div class="user-avatar" id="userAvatar">G</div>
            <div class="user-info">
                <div class="user-name" id="userName">Guest</div>
                <div class="user-label">Signed in</div>
            </div>
        </div>

        <div class="divider"></div>

        <button class="btn-logout" id="btnLogout" onclick="doLogout()">Yes, Sign Me Out →</button>
        <a href="Home.html" class="btn-stay">No, Take Me Back</a>

        <!-- Redirecting feedback -->
        <div class="redirect-msg" id="redirectMsg">
            <div class="redirect-dots">Signing out<span id="dotAnim">...</span></div>
        </div>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
        /* ── Cursor ── */
        const cursor = document.getElementById('cursor');
        const ring   = document.getElementById('cursorRing');
        let mx = 0, my = 0, rx = 0, ry = 0;
        document.addEventListener('mousemove', e => {
            mx = e.clientX; my = e.clientY;
            cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
        });
        (function animRing() {
            rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
            ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
            requestAnimationFrame(animRing);
        })();
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => { ring.style.width = '52px'; ring.style.height = '52px'; ring.style.opacity = '.3'; });
            el.addEventListener('mouseleave', () => { ring.style.width = '36px'; ring.style.height = '36px'; ring.style.opacity = '.6'; });
        });

        /* ── Show logged-in user if stored ── */
        const storedUser = localStorage.getItem('bhUser');
        if (storedUser) {
            try {
                const u = JSON.parse(storedUser);
                const displayName = (u.firstName || u.name || 'Guest');
                document.getElementById('userName').textContent = displayName;
                document.getElementById('userAvatar').textContent = displayName.charAt(0).toUpperCase();
            } catch(e) {
                document.getElementById('userName').textContent = storedUser;
                document.getElementById('userAvatar').textContent = storedUser.charAt(0).toUpperCase();
            }
        }

        /* ── Logout logic ── */
        function doLogout() {
            const btn = document.getElementById('btnLogout');
            btn.disabled = true;
            btn.textContent = 'Signing out…';
            btn.style.opacity = '.6';

            // Show redirecting feedback
            document.getElementById('redirectMsg').classList.add('show');
            const bar = document.getElementById('progressBar');
            bar.classList.add('show');
            setTimeout(() => {
                document.getElementById('progressFill').style.width = '100%';
            }, 50);

            // Animate dots
            let dots = 0;
            const dotEl = document.getElementById('dotAnim');
            const dotInterval = setInterval(() => {
                dots = (dots + 1) % 4;
                dotEl.textContent = '.'.repeat(dots) || '   ';
            }, 400);

            // Clear session data
            setTimeout(() => {
                clearInterval(dotInterval);

                // Clear cart
                localStorage.removeItem('bhCart');

                // Clear user session
                localStorage.removeItem('bhUser');
                localStorage.removeItem('bhLoggedIn');

                // Redirect to login
                window.location.href = 'login.html';
            }, 2200);
        }
    </script>
</body>
</html>
